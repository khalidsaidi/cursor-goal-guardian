# Guardian's command-line door to OpenAI Codex's own goal package: its goal extension (tool handlers, accounting,
# steering, the user-facing goal service) and its goal store. Codex's crates come straight from its repository at
# the commit vendored in third_party/codex, unmodified; nothing of theirs is copied here.
[package]
name = "goal-guardian-codex-goals"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "goal-guardian-codex-goals"
path = "src/main.rs"

[dependencies]
codex-state = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-goal-extension = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-extension-api = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-core = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-analytics = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
codex-tools = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
# Codex's own test support: a real Codex thread whose model endpoint is a local server. Used to hand Codex's
# continuation turn back as data (src/continuation.rs).
core_test_support = { git = "https://github.com/openai/codex", rev = "ac54a05173d090b9fdfa181ea49b92f45aff2681" }
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
anyhow = "1"
serde_json = "1"

# Codex's Windows PTY uses std::ffi::c_void; winapi must use the same definition.
# Enable its std feature in this wrapper without changing the upstream source.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["std"] }

# The same replacements Codex's own workspace makes (codex-rs/Cargo.toml [patch.crates-io]); a git dependency
# doesn't bring them along.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
# Codex's workspace also patches v8, but it is unused in this wrapper.
# Do not fetch its Chromium submodules for a dependency absent from the goal graph.

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[profile.release]
strip = true
lto = "thin"
# Match the pinned Codex workspace release profile: balance code generation
# against binary size without changing panic handling or runtime features.
codegen-units = 4

[workspace]
