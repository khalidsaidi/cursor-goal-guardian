name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # All six shipped architectures execute their own binaries.
        # macos-15-intel is the supported x64 runner (macos-13 queues are
        # chronically starved); macos-latest additionally executes the
        # darwin-x64 binaries under Rosetta as a second, faster x64 proof.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # bun compiles five targets; windows-arm64 builds via Node SEA instead
      # (bun has no win-arm64 build, so the step is skipped there).
      - uses: oven-sh/setup-bun@v2
        if: matrix.os != 'windows-11-arm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm -r build
      - run: pnpm -r exec tsc -p tsconfig.json --noEmit
      - run: pnpm -r test
      # Free e2e scenarios keep the harness itself from rotting; billable
      # agent scenarios are skipped automatically in CI (no cursor-agent,
      # and the harness gates on GG_E2E_CONFIRM there).
      - run: pnpm --filter @goal-guardian/e2e test:e2e:offline
      # Second x64 proof for macOS, independent of Intel-runner queues: the
      # arm64 runner cross-compiles the darwin-x64 binaries and EXECUTES them
      # under Rosetta — a real run of the shipped artifact, not just a build.
      - name: darwin-x64 binaries under Rosetta
        if: matrix.os == 'macos-latest'
        run: |
          node scripts/compile-binaries.mjs --target darwin-x64
          file dist-bin/darwin-x64/goal-guardian-hook | grep x86_64
          echo '{"hook_event_name":"beforeShellExecution","command":"git status","workspace_roots":["'"$PWD"'"]}' \
            | ./dist-bin/darwin-x64/goal-guardian-hook | grep '"permission":"allow"'
