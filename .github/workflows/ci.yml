name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # All six shipped architectures execute their own binaries.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # bun compiles five targets; windows-arm64 builds via Node SEA instead
      # (bun has no win-arm64 build, so the step is skipped there).
      - uses: oven-sh/setup-bun@v2
        if: matrix.os != 'windows-11-arm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm -r build
      - run: pnpm -r exec tsc -p tsconfig.json --noEmit
      - run: pnpm -r test
      # Free e2e scenarios keep the harness itself from rotting; billable
      # agent scenarios are skipped automatically in CI (no cursor-agent,
      # and the harness gates on GG_E2E_CONFIRM there).
      - run: pnpm --filter @goal-guardian/e2e test:e2e:offline
