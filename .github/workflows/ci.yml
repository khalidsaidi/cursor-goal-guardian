name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Codex's goal store behind Guardian's Rust binary, built natively on each of the six shipped architectures
  # (Rust is not cross-compiled). The binary is uploaded so a release can pick it up per platform.
  codex-goals:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/codex-goals
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/codex-goals
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: the binary keeps a goal and its budget
        run: |
          BIN=target/release/goal-guardian-codex-goals
          HOME_DIR="$RUNNER_TEMP/codex-goals-home"
          echo '{"op":"set","objective":"CI goal","token_budget":100}' | "$BIN" --home "$HOME_DIR" | grep '"status":"active"'
          echo '{"op":"account","tokens":150,"seconds":1}' | "$BIN" --home "$HOME_DIR" | grep '"status":"budget_limited"'
      - uses: actions/upload-artifact@v4
        with:
          name: codex-goals-${{ matrix.target }}
          path: |
            packages/codex-goals/target/release/goal-guardian-codex-goals
            packages/codex-goals/target/release/goal-guardian-codex-goals.exe
          if-no-files-found: error

  build-test:
    env:
      # The Rust binary has its own job above; here the package is built without it, which Guardian tolerates.
      GOAL_GUARDIAN_SKIP_CODEX_GOALS: "1"
    strategy:
      fail-fast: false
      matrix:
        # All six shipped architectures execute their own binaries.
        # macos-15-intel is the supported x64 runner (macos-13 queues are
        # chronically starved); macos-latest additionally executes the
        # darwin-x64 binaries under Rosetta as a second, faster x64 proof.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # bun compiles five targets; windows-arm64 builds via Node SEA instead
      # (bun has no win-arm64 build, so the step is skipped there).
      - uses: oven-sh/setup-bun@v2
        if: matrix.os != 'windows-11-arm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm -r build
      - run: pnpm -r exec tsc -p tsconfig.json --noEmit
      - run: pnpm -r test
      # Free e2e scenarios keep the harness itself from rotting; billable
      # agent scenarios are skipped automatically in CI (no cursor-agent,
      # and the harness gates on GG_E2E_CONFIRM there).
      - run: pnpm --filter @goal-guardian/e2e test:e2e:offline
      # The shipped VSIX for this machine, with its pinned, checksum-verified Python: RRSI's
      # self-improvement runs on that interpreter, so it has to start on every architecture.
      - run: node scripts/package-extension.js
      - name: bundled Python runs RRSI's imports
        shell: bash
        run: |
          cd packages/cursor-goal-guardian-extension
          if [ -x bin/python/python.exe ]; then PY=bin/python/python.exe; else PY=bin/python/bin/python3; fi
          (cd rsi/rrsi && "../../$PY" -c "import rrsi.loop, rrsi.propose, rrsi.critic, rrsi.selection; print('rrsi imports ok')")
      # Second x64 proof for macOS, independent of Intel-runner queues: the
      # arm64 runner cross-compiles the darwin-x64 binaries and EXECUTES them
      # under Rosetta — a real run of the shipped artifact, not just a build.
      - name: darwin-x64 binaries under Rosetta
        if: matrix.os == 'macos-latest'
        run: |
          node scripts/compile-binaries.mjs --target darwin-x64
          file dist-bin/darwin-x64/goal-guardian-hook | grep x86_64
          echo '{"hook_event_name":"beforeShellExecution","command":"git status","workspace_roots":["'"$PWD"'"]}' \
            | ./dist-bin/darwin-x64/goal-guardian-hook | grep '"permission":"allow"'
