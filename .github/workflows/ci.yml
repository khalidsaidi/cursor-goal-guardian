name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm -r build
      - run: pnpm -r exec tsc -p tsconfig.json --noEmit
      - run: pnpm -r test
      # Free e2e scenarios keep the harness itself from rotting; billable
      # agent scenarios are skipped automatically in CI (no cursor-agent,
      # and the harness gates on GG_E2E_CONFIRM there).
      - run: pnpm --filter @goal-guardian/e2e test:e2e:offline
