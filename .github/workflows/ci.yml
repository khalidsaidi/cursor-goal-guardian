name: Windows upstream release profile verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/codex-goals/target
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare a clean native build
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          foreach ($path in @($env:CARGO_TARGET_DIR, '.cache/codex-goals', 'dist-bin/win32-x64')) {
            if (Test-Path $path) { throw "Expected clean build directory: $path" }
          }
          rustup toolchain install 1.100.0 --profile minimal
          rustc -vV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Compile and package from source
        run: pnpm package:vsix --target win32-x64
        env:
          CGG_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Compare compiler output with the copy in the VSIX
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          name = "goal-guardian-codex-goals.exe"
          binary = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / name
          archive = Path("packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix")
          with binary.open("rb") as raw, ZipFile(archive) as package, package.open("extension/bin/" + name) as entry:
              compiled = hashlib.file_digest(raw, "sha256").hexdigest()
              packed = hashlib.file_digest(entry, "sha256").hexdigest()
          assert compiled == packed, "Packaged executable differs from compiler output"
          with archive.open("rb") as vsix:
              digest = hashlib.file_digest(vsix, "sha256").hexdigest()
          record = dict(commit=os.environ["GITHUB_SHA"], compiled_sha256=compiled, packaged_exe_sha256=packed, vsix_sha256=digest)
          print(json.dumps(record))
          Path("native-build.json").write_text(json.dumps(record, indent=2) + "\n")
      - name: Test the packaged extension on Windows
        run: node scripts/verify-package.mjs packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix
        env:
          CGG_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Retain the package and its verification
        if: ${{ !cancelled() && hashFiles('native-build.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-upstream-profile-package
          path: |
            native-build.json
            packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix
            packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix.verified.json
          compression-level: 0
          retention-days: 7
