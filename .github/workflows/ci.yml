name: Windows release build verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 135
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/codex-goals/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1427598a0b0a3e0f24a897c6a8b15970f1b88ffa
          persist-credentials: false
      - name: Prepare native build
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          if (Test-Path $env:CARGO_TARGET_DIR) { throw 'Expected an empty build directory' }
          rustup toolchain install 1.100.0 --profile minimal
          rustc +1.100.0 -vV
      - name: Compile the pinned release without a build cache
        working-directory: packages/codex-goals
        run: cargo +1.100.0 build --release --locked
      - name: Record rebuilt executable digest
        run: |
          $file = Join-Path $env:CARGO_TARGET_DIR 'release/goal-guardian-codex-goals.exe'
          Get-FileHash $file | Format-List
          git diff --exit-code
      - name: Scan the rebuilt file without executing it
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'clamav.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'clamav-tools'
          $db = Join-Path $env:RUNNER_TEMP 'clamav-db'
          Invoke-WebRequest 'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.1/clamav-1.5.1.win.x64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '2644780016d308f64cbb0b5b4d8d1263e6f65813329f9d93ecd5751d968f506d') { throw 'Scanner archive checksum mismatch' }
          Expand-Archive $archive $tools
          $scanner = (Get-ChildItem $tools -Recurse -Filter clamscan.exe).FullName
          $update = (Get-ChildItem $tools -Recurse -Filter freshclam.exe).FullName
          New-Item $db -ItemType Directory | Out-Null
          $config = Join-Path $env:RUNNER_TEMP 'freshclam.conf'
          'DatabaseMirror database.clamav.net' | Set-Content -Encoding ascii $config
          & $update "--config-file=$config" "--datadir=$db"
          if ($LASTEXITCODE -ne 0) { throw 'Could not update antivirus definitions' }
          & $scanner "--database=$db" '--max-filesize=300M' (Join-Path $env:CARGO_TARGET_DIR 'release/goal-guardian-codex-goals.exe')
          exit $LASTEXITCODE
