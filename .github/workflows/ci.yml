name: Windows native package verification
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CGG_USE_CACHED_CODEX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-package
          run-id: 44214821793
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-build
      - name: Verify and extract the freshly compiled Windows executable
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          source = Path(os.environ["RUNNER_TEMP"]) / "native-build"
          expected = "434fadd91dab64fac076aa73c94898837516a838e02339dedc59fd8a494b51fb"
          record = json.loads((source / "native-build.json").read_text())
          assert record["commit"] == "62d0742b23b908bfad14e3e2a2ca520261ad6e68"
          assert record["compiled_sha256"] == record["packaged_exe_sha256"] == expected
          archive, = source.rglob("*.vsix")
          with archive.open("rb") as file:
              assert hashlib.file_digest(file, "sha256").hexdigest() == record["vsix_sha256"]
          name = "goal-guardian-codex-goals.exe"
          target = Path(".cache/codex-goals/win32-x64") / name
          target.parent.mkdir(parents=True)
          with ZipFile(archive) as vsix, vsix.open("extension/bin/" + name) as binary, target.open("xb") as out:
              import shutil
              shutil.copyfileobj(binary, out)
          with target.open("rb") as binary:
              assert hashlib.file_digest(binary, "sha256").hexdigest() == expected
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-versions.mjs
      - run: pnpm -r build
      - name: Package Windows x64 1.0.6
        run: pnpm package:vsix --target win32-x64
        env:
          CGG_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Compare compiler output with the copy in the VSIX
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          name = "goal-guardian-codex-goals.exe"
          binary = Path(".cache/codex-goals/win32-x64") / name
          archive = Path("packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix")
          with binary.open("rb") as raw, ZipFile(archive) as package, package.open("extension/bin/" + name) as entry:
              compiled = hashlib.file_digest(raw, "sha256").hexdigest()
              packed = hashlib.file_digest(entry, "sha256").hexdigest()
          with ZipFile(archive) as vsix:
              assert json.loads(vsix.read("extension/package.json"))["version"] == "1.0.6"
          assert compiled == packed, "Packaged executable differs from compiler output"
          with archive.open("rb") as vsix:
              digest = hashlib.file_digest(vsix, "sha256").hexdigest()
          record = dict(commit=os.environ["GITHUB_SHA"], compiled_sha256=compiled, packaged_exe_sha256=packed, vsix_sha256=digest)
          print(json.dumps(record))
          Path("native-build.json").write_text(json.dumps(record, indent=2) + "\n")
      - name: Test the packaged extension on Windows
        run: node scripts/verify-package.mjs packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix
        env:
          CGG_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Retain the package and its verification
        if: ${{ !cancelled() && hashFiles('native-build.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate-1.0.6
          path: |
            native-build.json
            packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix
            packages/cursor-goal-guardian-extension/cursor-goal-guardian-win32-x64.vsix.verified.json
          compression-level: 0
          retention-days: 1
